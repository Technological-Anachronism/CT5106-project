name: Analytics integration
on:
  pull_request:
  push:
    branches: [main, 'feature/senlei-*']
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: analytics_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d analytics_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Analytics unit tests
        run: sh ./mvnw -B -Dtest=AnalyticsServiceTest,AnalyticsAdminFilterTest test
      - name: Package backend
        run: sh ./mvnw -B -DskipTests package
      - name: Analytics integration against PostgreSQL
        env:
          ANALYTICS_TEST_DB_URL: jdbc:postgresql://localhost:5432/analytics_test
          ANALYTICS_TEST_DB_USER: postgres
          ANALYTICS_TEST_DB_PASSWORD: test-only
        run: sh ./mvnw -B -Dtest=AnalyticsIntegrationTest test
      - name: Build shared frontend and check Analytics logout
        working-directory: frontend
        run: |
          npm ci
          node src/analytics/AnalyticsPage.test.cjs
          npm run build
