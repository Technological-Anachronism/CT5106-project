name: Build and test BMS

on:
  push:
    branches: [main, boyue-assignment4]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/bms_test
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build, unit test, integration test and package
        run: bash ./mvnw clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            portal-frontend/package-lock.json
      - name: Build user and service dashboards including Analytics
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build ticket portal
        working-directory: portal-frontend
        run: npm ci && npm run build
