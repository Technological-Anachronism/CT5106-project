# Isolated Analytics integration database; never points at the normal bms database.
# Override only with a disposable test database: Hibernate creates/drops its tables.
spring.datasource.url=${ANALYTICS_TEST_DB_URL:jdbc:h2:mem:analytics_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${ANALYTICS_TEST_DB_USER:sa}
spring.datasource.password=${ANALYTICS_TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
