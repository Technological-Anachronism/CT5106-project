spring.application.name=bms-service-portal
# 8080 is often taken on Windows by ApplicationWebServer.exe; use 8081 locally.
server.port=8081

# PostgreSQL database "bms" on this machine. Set DB_URL, DB_USER and DB_PASSWORD to use a different one.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bms}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Analytics tab Basic Auth. Override with BMS_ANALYTICS_ADMIN_USERNAME / BMS_ANALYTICS_ADMIN_PASSWORD.
bms.analytics.admin.username=${BMS_ANALYTICS_ADMIN_USERNAME:admin}
bms.analytics.admin.password=${BMS_ANALYTICS_ADMIN_PASSWORD:admin}
